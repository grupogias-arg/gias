  home:
    hero_title: Arañas Mygalomorphae, origen y diversidad
    hero_keywords:
      - Sistemática
      - Biogeografía
      - Ecología
      - Comportamiento
      - Conservación
    intro_label: Quiénes somos
    intro_title: El grupo
    intro_body: >
      Abordamos estudios para la comprensión del origen y descripción de la
      diversidad de las arañas Mygalomorphae, indagando sobre los procesos que
      dan forma a su dinámica temporal y espacial. Integramos diversos aspectos
      sistemáticos, biogeográficos, ecológicos y comportamentales. Las
      migalomorfas poseen un gran potencial para desarrollar estudios evolutivos
      integrativos debido a sus características biológicas únicas, que a su vez
      las ubican entre las principales especies en peligro de extinción.
    intro_body_2: >
      Implementamos enfoques multidisciplinarios utilizando a las migalomorfas
      como modelos de estudio para los procesos subyacentes en relación a su
      biodiversidad y a la evolución de los ecosistemas terrestres.
      Específicamente, abordamos la descripción de nuevas especies, la
      realización de inventarios biológicos, bases de datos e imágenes
      digitales. Además, inferimos sobre la delimitación de especies a partir de
      análisis de filogenia morfológica y molecular y analizamos patrones
      biogeográficos y procesos involucrados. También estudiamos su historia
      natural, ecología térmica, comportamiento y conservación.

