# Español: idioma por defecto del sitio.
#
# Los mensajes propios de Rails (errores de validación, fechas, números) los
# aporta la gema rails-i18n. Acá solo van las claves del proyecto y los
# arreglos puntuales a traducciones de la gema que quedaban mal redactadas:
# los archivos de la app se cargan después, así que estos valores ganan.
es:
  errors:
    messages:
      # La gema trae "%{count} carácter exactos" en singular.
      wrong_length:
        one: no tiene la longitud correcta (%{count} carácter exacto)
        other: no tiene la longitud correcta (%{count} caracteres exactos)
    template:
      # La gema trae "No se pudo guardar este/a %{model}...". Lo carga gente
      # no técnica: mejor sin la barra.
      header:
        one: "No se pudo guardar: hay %{count} error en el formulario."
        other: "No se pudo guardar: hay %{count} errores en el formulario."
      body: "Revisá estos campos:"

  activerecord:
    models:
      post:
        one: Novedad
        other: Novedades
      member:
        one: Integrante
        other: Integrantes
      publication:
        one: Publicación
        other: Publicaciones
      project:
        one: Proyecto
        other: Proyectos
      campaign:
        one: Campaña
        other: Campañas
      outreach_item:
        one: Material de divulgación
        other: Materiales de divulgación

    attributes:
      post:
        title: Título
        title_en: Título en inglés
        slug: Dirección web
        kind: Tipo
        published_at: Fecha de publicación
        excerpt: Resumen
        excerpt_en: Resumen en inglés
