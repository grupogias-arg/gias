  home:
    hero_title: Mygalomorph spiders, origin and diversity
    hero_keywords:
      - Systematics
      - Biogeography
      - Ecology
      - Behaviour
      - Conservation
    intro_label: About us
    intro_title: The group
    intro_body: >
      We study the origin and diversity of Mygalomorphae spiders, investigating
      the processes that shape their temporal and spatial dynamics. Our work
      brings together systematics, biogeography, ecology and behaviour.
      Mygalomorphs hold great potential for integrative evolutionary studies
      because of their unique biological traits — the same traits that place
      them among the most endangered spider species.
    intro_body_2: >
      We take multidisciplinary approaches, using mygalomorphs as model
      organisms for the processes underlying their biodiversity and the
      evolution of terrestrial ecosystems. Specifically, we describe new
      species and build biological inventories, databases and digital imaging.
      We also delimit species through morphological and molecular phylogenetic
      analysis, and examine biogeographic patterns and the processes behind
      them, alongside natural history, thermal ecology, behaviour and
      conservation.

