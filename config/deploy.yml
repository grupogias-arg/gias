# Deploy con Kamal a un VPS de Hetzner. Paso a paso en docs/deploy.md.
#
# Lo único que hay que tocar acá es la IP del servidor y el dominio.

service: gias
image: gias

servers:
  web:
    - 2.29.9.94

# Let's Encrypt saca el certificado solo, siempre que el dominio ya apunte a
# la IP de arriba. Se puede tener más de un dominio a la vez (el de prueba y
# el definitivo) poniendo `hosts:` con una lista en vez de `host:`.
proxy:
  ssl: true
  host: gias.morci-the-dog.lat

# Clave propia del proyecto, no la personal ni la del trabajo. Tiene
# passphrase: cargarla en el agente con `ssh-add --apple-use-keychain`.
ssh:
  keys: [ "~/.ssh/gias" ]

# Registro local: Kamal levanta uno en la Mac y lo pasa al servidor por SSH.
# No hace falta cuenta en Docker Hub.
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - GIAS_DATABASE_PASSWORD
  clear:
    DB_HOST: gias-db
    # Los jobs (Solid Queue) corren dentro del mismo proceso que la web.
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "gias_storage:/rails/storage"

asset_path: /rails/public/assets

# Servidor ARM (Hetzner CAX) y Mac con Apple Silicon: la imagen se construye
# nativa, sin emulación. Si el servidor es x86 (CX/CPX), cambiar a amd64.
builder:
  arch: arm64

accessories:
  db:
    image: postgres:17
    host: 2.29.9.94
    # Solo escucha en el servidor mismo, no hacia internet. El túnel SSH de
    # docs/deploy.md entra por acá para cargar los seeds desde la Mac.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: gias
        POSTGRES_DB: gias_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
